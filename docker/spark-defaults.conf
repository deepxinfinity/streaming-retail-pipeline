# Single source of Spark/catalog config 
# (jobs, pyspark shell, dbt session mode)

spark.jars.packages                         org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
spark.sql.extensions                        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                 rest
spark.sql.catalog.lake.uri                  http://iceberg-rest:8181
spark.sql.catalog.lake.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint          http://localhost:9000
spark.sql.catalog.lake.s3.path-style-access true
spark.sql.catalog.lake.client.region        us-east-1
spark.sql.defaultCatalog                    lake
spark.sql.session.timeZone                  UTC
spark.sql.shuffle.partitions                8
spark.driver.memory                         2g
spark.serializer                            org.apache.spark.serializer.KryoSerializer
