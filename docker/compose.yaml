name: streaming-retail-pipeline

x-env: &default-env
  env_file:
    - ../.env

services:

  postgres:
    image: postgres:16
    container_name: rl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-retail}
    ports:
      - "5432:5432"
    volumes:
      - ../sim/sql:/docker-entrypoint-initdb.d:ro
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10
  kafka:
    image: apache/kafka:3.8.0
    container_name: rl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 336
    volumes:
      - ../data/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: rl-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in "online_orders:6" "store_pos:6" "sales_dlq:1"; do
          topic="$${t%%:*}"; parts="$${t##*:}"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" --partitions "$$parts" --replication-factor 1
        done
        echo "topics ready"
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rl-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # object storage + iceberg catalog
  minio:
    image: minio/minio:latest
    container_name: rl-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    volumes:
      - ../data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
  mc:
    image: minio/mc:latest
    container_name: rl-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minio} $${MINIO_ROOT_PASSWORD:-minio12345}
        mc mb --ignore-existing local/lake
        echo "bucket lake ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: rl-iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://lake/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio12345}
      AWS_REGION: ${AWS_REGION:-us-east-1}

  # streaming jobs as containers (profile: stream)
  streamer-bronze:
    build:
      context: ..
      dockerfile: docker/streamer.Dockerfile
    container_name: rl-streamer-bronze
    profiles: ["stream"]
    depends_on:
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    command: python ingestion/stream_bronze.py
    working_dir: /repo
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      CHECKPOINT_DIR: /repo/chk
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio12345}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ..:/repo
      - ../data/ivy:/root/.ivy2
    mem_limit: 3g
    restart: unless-stopped
  streamer-silver:
    build:
      context: ..
      dockerfile: docker/streamer.Dockerfile
    container_name: rl-streamer-silver
    profiles: ["stream"]
    depends_on:
      iceberg-rest:
        condition: service_started
    command: python ingestion/stream_silver_sales.py
    working_dir: /repo
    environment:
      CHECKPOINT_DIR: /repo/chk
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio12345}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ..:/repo
      - ../data/ivy:/root/.ivy2
    mem_limit: 3g
    restart: unless-stopped

  # orchestration
  airflow:
    build:
      context: ..
      dockerfile: docker/airflow.Dockerfile
    container_name: rl-airflow
    depends_on:
      postgres:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    command: airflow standalone
    ports:
      - "8082:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/repo/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minio12345}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP: kafka:29092
      ICEBERG_REST_URI: http://iceberg-rest:8181
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ..:/opt/airflow/repo
      - ../data/ivy:/home/airflow/.ivy2
    mem_limit: 4g

  # experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: rl-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5001:5000"
    volumes:
      - ../data/mlflow:/mlflow
